<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>邮箱验证 · HKU Campus Life</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #19372c; background: #f6f8f5; font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(100%, 420px); padding: 32px; background: white; border: 1px solid #dce5df; border-radius: 20px; }
    h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.3; }
    p { margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">正在确认结果…</h1>
    <p id="message">请稍候。</p>
  </main>
  <script>
    const fragment = new URLSearchParams(window.location.hash.slice(1));
    const query = new URLSearchParams(window.location.search);
    const failed = fragment.has('error') || fragment.has('error_code') || query.has('error') || query.has('error_code');
    const confirmed = fragment.has('access_token') && fragment.get('token_type') === 'bearer';
    // Confirmation redirects may contain session tokens. This page never stores or sends them.
    window.history.replaceState(null, '', window.location.pathname);
    document.getElementById('title').textContent = failed ? '验证未完成' : confirmed ? '邮箱已验证' : '请确认邮箱验证结果';
    document.getElementById('message').textContent = failed
      ? '链接可能已过期或已使用。请返回 App 登录；如果仍提示邮箱未验证，请联系项目管理员。'
      : confirmed
        ? '请手动返回 HKU Campus Life App，使用刚才设置的邮箱和密码登录。'
        : '请确认你是通过验证邮件打开此页。若 App 登录时提示邮箱未验证，请联系项目管理员。';
  </script>
</body>
</html>
